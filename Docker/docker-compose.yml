services:
  paginavox:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    image: paginavox:gpu
    container_name: paginavox-gpu
    ports:
      - "7860:7860"
    volumes:
      - ../audio:/app/audio
      - ../txt:/app/txt
      - ../output:/app/output
      - ../profiles:/app/profiles
      - paginavox-hf-cache:/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
    shm_size: "8gb"
    stdin_open: true
    tty: true

volumes:
  paginavox-hf-cache:
